# Static SPA server for the Seapedia web app (TanStack Router, client-side routes).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Content-hashed build output: safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The app shell must always be revalidated so new deploys are picked up.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Client-side routes: unknown paths serve the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
