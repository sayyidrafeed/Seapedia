# Static SPA server for the Seapedia web app (TanStack Router, client-side routes).
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  # Locations that set Cache-Control keep these too.
  add_header_inherit merge;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hidden paths (.env, .git, ...) are never served; /.well-known/ stays reachable.
  location ~ /\.(?!well-known/) {
    return 404;
  }

  # Content-hashed build output: safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The app shell must always be revalidated so new deploys are picked up.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Client-side routes: unknown paths serve the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
