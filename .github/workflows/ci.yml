name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BUN_VERSION: '1.4.4'

jobs:
  # Which deployables changed? A service is affected by its own directory, the shared platform
  # package, and the lockfile; the gateway image by infra/kong. Everything counts as changed when
  # the diff base is unknown.
  changes:
    name: Detect changed services
    # Set the CI_RUNNER repository variable to switch runners (e.g. a Blacksmith label).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      services: ${{ steps.diff.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          all='["gateway","identity","catalog","commerce","search","web","seed"]'
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "services=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          if echo "$files" | grep -qE '^(packages/platform/|bun\.lock$|package\.json$|tsconfig\.base\.json$|\.github/workflows/)'; then
            echo "services=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=()
          for svc in identity catalog commerce search; do
            echo "$files" | grep -q "^services/$svc/" && changed+=("\"$svc\"")
          done
          echo "$files" | grep -q '^infra/kong/' && changed+=('"gateway"')
          echo "$files" | grep -q '^apps/web/' && changed+=('"web"')
          echo "$files" | grep -qE '^(infra/seed/|services/(identity|commerce)/src/db/)' && changed+=('"seed"')
          echo "services=[$(IFS=,; echo "${changed[*]}")]" >> "$GITHUB_OUTPUT"

  # Fails on any high or critical advisory in the dependency tree (runtime and tooling).
  audit:
    name: Dependency audit
    # Set the CI_RUNNER repository variable to switch runners (e.g. a Blacksmith label).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high

  check:
    name: Check ${{ matrix.workspace }}
    # Set the CI_RUNNER repository variable to switch runners (e.g. a Blacksmith label).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - packages/platform
          - services/identity
          - services/catalog
          - services/commerce
          - services/search
          - infra/seed
          - apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Type check
        working-directory: ${{ matrix.workspace }}
        run: bun run check
      - name: Lint and format
        working-directory: ${{ matrix.workspace }}
        run: bun run fl
      - name: Unit tests
        if: startsWith(matrix.workspace, 'services/') || matrix.workspace == 'packages/platform'
        working-directory: ${{ matrix.workspace }}
        run: bun test
      - name: Build
        if: matrix.workspace == 'apps/web'
        working-directory: apps/web
        run: bun run build

  publish:
    name: Publish ${{ matrix.service }}
    needs: [changes, check, audit]
    # main publishes :main/:latest and deploys; same-repo PRs publish :<sha> and :pr-<n> so a test
    # server can pull them before merge (fork PRs get a read-only token and are skipped).
    if: >-
      needs.changes.outputs.services != '[]' &&
      (github.ref == 'refs/heads/main' && github.event_name == 'push' ||
       github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    # Set the CI_RUNNER repository variable to switch runners (e.g. a Blacksmith label).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image and Dockerfile
        id: meta
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/seapedia-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.service }}" = web ]; then
            echo "dockerfile=apps/web/Dockerfile" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.service }}" = gateway ]; then
            echo "dockerfile=infra/kong/Dockerfile" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.service }}" = seed ]; then
            echo "dockerfile=infra/seed/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "dockerfile=services/${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          target: ${{ matrix.service == 'web' && 'release' || '' }}
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          build-args: |
            VITE_API_URL=${{ vars.PUBLIC_API_URL }}
            VITE_APP_URL=${{ vars.PUBLIC_WEB_URL }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.event.pull_request.head.sha || github.sha }}
            ${{ github.event_name == 'pull_request' && format('{0}:pr-{1}', steps.meta.outputs.image, github.event.pull_request.number) || '' }}
            ${{ github.event_name == 'push' && format('{0}:main', steps.meta.outputs.image) || '' }}
            ${{ github.event_name == 'push' && format('{0}:latest', steps.meta.outputs.image) || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # Each Dokploy application has its own deploy webhook: services release independently.
      - name: Trigger deployment
        if: github.event_name == 'push' && vars[format('DEPLOY_WEBHOOK_URL_{0}', matrix.service)] != ''
        env:
          WEBHOOK: ${{ vars[format('DEPLOY_WEBHOOK_URL_{0}', matrix.service)] }}
        run: curl -fsS -X POST "$WEBHOOK"
