# Local development: infrastructure and Kong in Docker, the services on the host with hot reload.
#   bun scripts/generate-secrets.ts --dev    # writes services/*/.env and infra/seed/.env once
#   docker compose up -d
#   bun run dev
# Services register in Consul as host.docker.internal, so Kong (in Docker) reaches them on the host.
name: seapedia-dev

services:
  consul:
    image: hashicorp/consul:2.0.4
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -data-dir=/consul/data -recursor=127.0.0.11
    ports: ['8500:8500']
    healthcheck:
      test: ['CMD', 'consul', 'members']
      interval: 5s
      retries: 20

  consul-init:
    image: hashicorp/consul:2.0.4
    entrypoint: ['/bin/sh', '/init.sh']
    environment: { CONSUL_HTTP_ADDR: http://consul:8500 }
    volumes: ['./infra/consul/init.sh:/init.sh:ro']
    depends_on: { consul: { condition: service_healthy } }

  rabbitmq:
    image: rabbitmq:4.2.9-management-alpine
    environment: { RABBITMQ_DEFAULT_USER: admin, RABBITMQ_DEFAULT_PASS: admin }
    ports: ['5672:5672', '15672:15672']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      retries: 20

  rabbitmq-init:
    image: oven/bun:1.4.2-alpine
    command: ['bun', '/init.ts']
    environment:
      RABBITMQ_API: http://rabbitmq:15672
      RABBITMQ_ADMIN_USER: admin
      RABBITMQ_ADMIN_PASSWORD: admin
      RABBITMQ_IDENTITY_PASSWORD: identity
      RABBITMQ_CATALOG_PASSWORD: catalog
      RABBITMQ_COMMERCE_PASSWORD: commerce
      RABBITMQ_SEARCH_PASSWORD: search
    volumes: ['./infra/rabbitmq/init.ts:/init.ts:ro']
    depends_on: { rabbitmq: { condition: service_healthy } }

  identity-db:
    image: postgres:17.11-alpine
    environment: { POSTGRES_USER: identity, POSTGRES_PASSWORD: identity, POSTGRES_DB: identity }
    ports: ['5432:5432']
    volumes: [identitydata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U identity']
      interval: 5s
      retries: 10

  commerce-db:
    image: postgres:17.11-alpine
    environment: { POSTGRES_USER: commerce, POSTGRES_PASSWORD: commerce, POSTGRES_DB: commerce }
    ports: ['5433:5432']
    volumes: [commercedata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U commerce']
      interval: 5s
      retries: 10

  catalog-db:
    image: mongo:7.0.45
    entrypoint: ['/infra/entrypoint.sh']
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      CATALOG_DB_PASSWORD: catalog
    ports: ['27017:27017']
    volumes:
      - catalogdata:/data/db
      - ./infra/mongo:/infra:ro
      - ./infra/mongo/init-catalog-user.js:/docker-entrypoint-initdb.d/init-catalog-user.js:ro
    healthcheck:
      test: ['CMD', '/infra/healthcheck.sh']
      interval: 5s
      retries: 30

  elasticsearch:
    image: elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: elastic
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'false'
    ports: ['9200:9200']
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsu elastic:elastic localhost:9200/_cluster/health >/dev/null']
      interval: 10s
      retries: 30

  gateway:
    build: { context: ., dockerfile: infra/kong/Dockerfile }
    env_file: [infra/kong/.env]
    environment:
      CORS_ORIGINS: http://localhost:5173
      CONSUL_DNS_HOST: consul
    ports: ['3001:8000']
    depends_on: { consul: { condition: service_healthy } }

volumes:
  identitydata:
  commercedata:
  catalogdata:
  esdata:
