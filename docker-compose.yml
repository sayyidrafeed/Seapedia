# Local development infrastructure. The apps run on the host with hot reload:
#   docker compose up -d && bun run dev
# See docs/SETUP.md.
name: seapedia-dev

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      IDENTITY_DB_PASSWORD: identity
      CATALOG_DB_PASSWORD: catalog
      COMMERCE_DB_PASSWORD: commerce
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: elastic
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'false'
    ports:
      - '9200:9200'
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsu elastic:elastic localhost:9200/_cluster/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  esdata:
