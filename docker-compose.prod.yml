# Production-like stack: every service from its own image, a database server per service, Kong at
# the edge, RabbitMQ for events, Consul for configuration and discovery. Memory limits target the
# 4 GB Dokploy host with ~1.8 GB already used by the OS and Dokploy (docs/DEPLOYMENT.md).
#   bun scripts/generate-secrets.ts > .env.prod.local
#   docker compose -f docker-compose.prod.yml --env-file .env.prod.local up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod.local --profile tools run --rm seed
name: seapedia

x-runtime: &runtime
  NODE_ENV: production
  CONSUL_HTTP_ADDR: http://consul:8500
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?run scripts/generate-secrets.ts}

x-r2: &r2
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
  R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN:-}

x-platform-ready: &platform-ready
  consul-init: { condition: service_completed_successfully }
  rabbitmq-init: { condition: service_completed_successfully }

services:
  # ── Platform ───────────────────────────────────────────────────────────────
  consul:
    image: hashicorp/consul:2.1.0
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -data-dir=/consul/data -recursor=127.0.0.11
    ports: ['127.0.0.1:8500:8500']
    volumes: [consuldata:/consul/data]
    mem_limit: 96m
    healthcheck:
      test: ['CMD', 'consul', 'members']
      interval: 5s
      retries: 20
    restart: unless-stopped

  consul-init:
    image: hashicorp/consul:2.1.0
    entrypoint: ['/bin/sh', '/init.sh']
    environment: { CONSUL_HTTP_ADDR: http://consul:8500 }
    volumes: ['./infra/consul/init.sh:/init.sh:ro']
    depends_on: { consul: { condition: service_healthy } }

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?}
    ports: ['127.0.0.1:15672:15672']
    volumes: [rabbitdata:/var/lib/rabbitmq]
    mem_limit: 256m
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      retries: 20
    restart: unless-stopped

  rabbitmq-init:
    image: oven/bun:1.4.4-alpine
    command: ['bun', '/init.ts']
    environment:
      RABBITMQ_API: http://rabbitmq:15672
      RABBITMQ_ADMIN_USER: admin
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD}
      RABBITMQ_IDENTITY_PASSWORD: ${RABBITMQ_IDENTITY_PASSWORD:?}
      RABBITMQ_CATALOG_PASSWORD: ${RABBITMQ_CATALOG_PASSWORD:?}
      RABBITMQ_COMMERCE_PASSWORD: ${RABBITMQ_COMMERCE_PASSWORD:?}
      RABBITMQ_SEARCH_PASSWORD: ${RABBITMQ_SEARCH_PASSWORD:?}
    volumes: ['./infra/rabbitmq/init.ts:/init.ts:ro']
    depends_on: { rabbitmq: { condition: service_healthy } }

  # ── Data stores: one server per service ───────────────────────────────────
  identity-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
      POSTGRES_DB: identity
    volumes: [identitydata:/var/lib/postgresql/data]
    mem_limit: 128m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U identity']
      interval: 5s
      retries: 10
    restart: unless-stopped

  commerce-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: ${COMMERCE_DB_PASSWORD:?}
      POSTGRES_DB: commerce
    volumes: [commercedata:/var/lib/postgresql/data]
    mem_limit: 128m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U commerce']
      interval: 5s
      retries: 10
    restart: unless-stopped

  catalog-db:
    image: mongo:7.0.45
    entrypoint: ['/infra/entrypoint.sh']
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${CATALOG_DB_ROOT_PASSWORD:?}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?}
      WIREDTIGER_CACHE_GB: '0.15'
    volumes:
      - catalogdata:/data/db
      - ./infra/mongo:/infra:ro
      - ./infra/mongo/init-catalog-user.js:/docker-entrypoint-initdb.d/init-catalog-user.js:ro
    mem_limit: 384m
    healthcheck:
      test: ['CMD', '/infra/healthcheck.sh']
      interval: 5s
      retries: 30
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms384m -Xmx384m
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?}
      xpack.security.enabled: 'true'
      # Plain HTTP on the private network only; never published.
      xpack.security.http.ssl.enabled: 'false'
    volumes: [esdata:/usr/share/elasticsearch/data]
    mem_limit: 900m
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsu "elastic:$$ELASTIC_PASSWORD" localhost:9200/_cluster/health >/dev/null']
      interval: 10s
      retries: 30
    restart: unless-stopped

  # ── Services ───────────────────────────────────────────────────────────────
  identity:
    build: { context: ., dockerfile: services/identity/Dockerfile }
    environment:
      <<: [*runtime, *r2]
      RABBITMQ_URL: amqp://identity:${RABBITMQ_IDENTITY_PASSWORD}@rabbitmq:5672/seapedia
      DATABASE_URL: postgres://identity:${IDENTITY_DB_PASSWORD}@identity-db:5432/identity
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?}
      SERVICE_CLIENT_SECRETS: catalog=${CATALOG_CLIENT_SECRET:?},search=${SEARCH_CLIENT_SECRET:?},seed=${SEED_CLIENT_SECRET:?}
    depends_on:
      <<: *platform-ready
      identity-db: { condition: service_healthy }
    mem_limit: 160m
    restart: unless-stopped

  catalog:
    build: { context: ., dockerfile: services/catalog/Dockerfile }
    environment:
      <<: [*runtime, *r2]
      RABBITMQ_URL: amqp://catalog:${RABBITMQ_CATALOG_PASSWORD}@rabbitmq:5672/seapedia
      SERVICE_CLIENT_SECRET: ${CATALOG_CLIENT_SECRET}
      MONGODB_URL: mongodb://catalog:${CATALOG_DB_PASSWORD}@catalog-db:27017/catalog?replicaSet=rs0&authSource=catalog
    depends_on:
      <<: *platform-ready
      catalog-db: { condition: service_healthy }
    mem_limit: 160m
    restart: unless-stopped

  commerce:
    build: { context: ., dockerfile: services/commerce/Dockerfile }
    environment:
      <<: *runtime
      RABBITMQ_URL: amqp://commerce:${RABBITMQ_COMMERCE_PASSWORD}@rabbitmq:5672/seapedia
      DATABASE_URL: postgres://commerce:${COMMERCE_DB_PASSWORD}@commerce-db:5432/commerce
    depends_on:
      <<: *platform-ready
      commerce-db: { condition: service_healthy }
    mem_limit: 160m
    restart: unless-stopped

  search:
    build: { context: ., dockerfile: services/search/Dockerfile }
    environment:
      <<: *runtime
      RABBITMQ_URL: amqp://search:${RABBITMQ_SEARCH_PASSWORD}@rabbitmq:5672/seapedia
      SERVICE_CLIENT_SECRET: ${SEARCH_CLIENT_SECRET}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
    depends_on:
      <<: *platform-ready
      elasticsearch: { condition: service_healthy }
    mem_limit: 160m
    restart: unless-stopped

  # ── Edge ───────────────────────────────────────────────────────────────────
  gateway:
    build: { context: ., dockerfile: infra/kong/Dockerfile }
    environment:
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      CORS_ORIGINS: ${WEB_URL:-http://localhost:8080}
      CONSUL_DNS_HOST: consul
    ports: ['3001:8000']
    depends_on:
      consul: { condition: service_healthy }
    mem_limit: 192m
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: release
      args:
        VITE_API_URL: ${API_URL:-http://localhost:3001}
        VITE_APP_URL: ${WEB_URL:-http://localhost:8080}
    ports: ['${WEB_PORT:-8080}:8080']
    mem_limit: 32m
    restart: unless-stopped

  # One-off: wipe and seed the three databases, then rebuild the search index.
  seed:
    profiles: [tools]
    build: { context: ., dockerfile: infra/seed/Dockerfile }
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
      IDENTITY_DATABASE_URL: postgres://identity:${IDENTITY_DB_PASSWORD}@identity-db:5432/identity
      CATALOG_MONGODB_URL: mongodb://catalog:${CATALOG_DB_PASSWORD}@catalog-db:27017/catalog?replicaSet=rs0&authSource=catalog
      COMMERCE_DATABASE_URL: postgres://commerce:${COMMERCE_DB_PASSWORD}@commerce-db:5432/commerce
      SEED_CLIENT_SECRET: ${SEED_CLIENT_SECRET}
    depends_on:
      identity: { condition: service_healthy }
      catalog: { condition: service_healthy }
      commerce: { condition: service_healthy }
      search: { condition: service_healthy }

volumes:
  consuldata:
  rabbitdata:
  identitydata:
  commercedata:
  catalogdata:
  esdata:
